<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viajes · Himura</title>
<meta name="theme-color" content="#0e7490">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#0a0e14;color:#e6edf3;
       min-height:100vh;padding:16px 14px 96px;font-size:15px}
  .wrap{max-width:780px;margin:0 auto}

  .top{display:flex;align-items:center;gap:11px;margin-bottom:14px}
  .logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#22d3ee,#0e7490);
        display:grid;place-items:center;font-size:21px;flex:0 0 auto}
  .top h1{font-size:1.1rem;line-height:1.25}
  .top .sub{color:#8b98a9;font-size:.78rem;margin-top:2px}

  .tabs{display:flex;gap:5px;background:#10161f;padding:5px;border-radius:13px;margin-bottom:16px}
  .tab{flex:1;text-align:center;padding:11px 4px;border-radius:9px;font-size:.83rem;font-weight:600;
       color:#8b98a9;cursor:pointer;border:0;background:transparent;font-family:inherit}
  .tab.on{background:#0e7490;color:#fff}

  /* ---- itinerario ---- */
  .dia{background:#121821;border:1px solid #1e2836;border-radius:15px;margin-bottom:10px;overflow:hidden}
  .dia.hoy{border-color:#0e7490}
  .dhead{padding:13px 15px;cursor:pointer;display:flex;align-items:center;gap:12px}
  .dnum{width:42px;height:42px;border-radius:11px;background:#0d131c;display:grid;place-items:center;
        flex:0 0 auto;line-height:1.1;text-align:center}
  .dnum b{font-size:1.05rem;display:block} .dnum span{font-size:.62rem;color:#7b8797}
  .dinfo{flex:1;min-width:0}
  .dinfo .f{font-size:.93rem;font-weight:600}
  .dinfo .h{color:#8b98a9;font-size:.78rem;margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .badge{font-size:.64rem;padding:2px 7px;border-radius:20px;font-weight:700;letter-spacing:.02em}
  .b-in{background:#14432a;color:#4ade80} .b-out{background:#3a2a20;color:#fbbf24}
  .cnt{font-size:.72rem;color:#6b7684;flex:0 0 auto}
  .dbody{display:none;padding:0 15px 13px} .dia.open .dbody{display:block}

  /* ---- items ---- */
  .it{background:#0d131c;border:1px solid #1b2431;border-radius:12px;padding:11px 13px;margin-bottom:7px}
  .it.desc{opacity:.45} .it.hecho .tx{text-decoration:line-through;color:#5d6875}
  .it .tx{font-size:.92rem;line-height:1.45;display:flex;gap:7px;align-items:flex-start}
  .it .meta{color:#6b7684;font-size:.74rem;margin-top:5px;line-height:1.5}
  .it .nota{color:#94a3b8;font-size:.79rem;margin-top:6px;line-height:1.5;
            max-height:3.2em;overflow:hidden;cursor:pointer}
  .it .nota.full{max-height:none}
  .acts{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
  .acts button,.acts a{background:#1a2432;color:#b8c4d0;border:0;border-radius:8px;padding:6px 10px;
       font-size:.73rem;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
  .acts .on{background:#0e7490;color:#fff}
  .acts .map{background:#1e3a5f;color:#93c5fd}

  .cat{margin-top:13px}
  .cat h3{font-size:.7rem;color:#7b8797;text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px}

  .dest{background:#121821;border:1px solid #1e2836;border-radius:15px;margin-bottom:11px;overflow:hidden}
  .dhead2{padding:13px 15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .dhead2 h2{font-size:.98rem}
  .arrow{color:#5d6875;transition:transform .2s} .open>.dhead2 .arrow,.dia.open .arrow{transform:rotate(90deg)}
  .dest .dbody{display:none} .dest.open .dbody{display:block}

  .hotel{background:linear-gradient(135deg,rgba(34,211,238,.08),transparent);
         border:1px solid #1b3a4a;border-radius:12px;padding:11px 13px;margin-bottom:9px}
  .hotel .n{font-weight:700;font-size:.9rem} .hotel .d{color:#8b98a9;font-size:.76rem;margin-top:4px;line-height:1.5}

  .fab{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);
       max-width:780px;display:flex;gap:8px}
  .fab button{flex:1;background:#0e7490;color:#fff;border:0;border-radius:12px;padding:13px;
              font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit}
  .fab .g{background:#151c28;border:1px solid #1f2a3a;color:#8b98a9;flex:0 0 52px}

  .modal{position:fixed;inset:0;background:rgba(5,8,12,.8);display:none;z-index:50;
         align-items:flex-end;justify-content:center}
  .modal.on{display:flex}
  .sheet{background:#111823;border:1px solid #1e2836;border-radius:20px 20px 0 0;padding:20px 17px 26px;
         width:100%;max-width:780px;max-height:88vh;overflow-y:auto}
  .sheet h3{font-size:1rem;margin-bottom:14px}
  .sheet label{display:block;font-size:.73rem;color:#7b8797;margin:9px 0 4px;text-transform:uppercase;letter-spacing:.05em}
  .sheet input,.sheet select,.sheet textarea{width:100%;background:#0a0e14;border:1px solid #1e2836;
      color:#e6edf3;border-radius:10px;padding:11px 13px;font-size:.9rem;font-family:inherit}
  .sheet textarea{resize:vertical;min-height:58px}
  .row{display:flex;gap:9px} .row>*{flex:1}
  .empty{color:#6b7684;text-align:center;padding:34px 12px;font-size:.87rem;line-height:1.65}
  .msg{text-align:center;font-size:.82rem;padding:9px;border-radius:9px;margin-top:10px;display:none}
  .msg.ok{background:#14432a;color:#4ade80;display:block}
  .msg.err{background:#3a2020;color:#ff8080;display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">✈️</div>
    <div><h1 id="vnom">Cargando…</h1><div class="sub" id="vsub"></div></div>
  </div>

  <div class="tabs">
    <button class="tab on" data-v="itin">📅 Itinerario</button>
    <button class="tab" data-v="ideas">💡 Ideas</button>
    <button class="tab" data-v="pend">✅ Pendientes</button>
  </div>

  <div id="cont"><div class="empty">Cargando…</div></div>
</div>

<div class="fab">
  <button id="add">➕ Agregar</button>
  <button class="g" id="refresh">↻</button>
</div>

<div class="modal" id="modal"><div class="sheet">
  <h3 id="mtit">Agregar</h3>
  <label>Qué es</label>
  <input id="f-text" placeholder="Ej: Cenote Dos Ojos / Alquilar auto">
  <div class="row">
    <div><label>Tipo</label>
      <select id="f-tipo">
        <option value="idea">💡 Idea / lugar</option>
        <option value="pendiente">✅ Pendiente (tarea)</option>
      </select></div>
    <div><label>Categoría</label>
      <select id="f-cat">
        <option value="actividad">🎯 Actividad</option>
        <option value="comida">🍽 Comida</option>
        <option value="lugar">📍 Lugar</option>
        <option value="hospedaje">🏨 Hospedaje</option>
        <option value="transporte">🚗 Transporte</option>
        <option value="tramite">📋 Trámite / servicio</option>
        <option value="otro">📎 Otro</option>
      </select></div>
  </div>
  <div class="row">
    <div><label>Destino</label><input id="f-dest" list="dl-dest" placeholder="Cancún"><datalist id="dl-dest"></datalist></div>
    <div><label>Fecha (opcional)</label><input id="f-fecha" type="date"></div>
  </div>
  <div class="row">
    <div><label>Hora</label><input id="f-hora" type="time"></div>
    <div><label>Estado</label>
      <select id="f-est">
        <option value="wishlist">💭 Idea</option>
        <option value="confirmado">✅ Confirmado</option>
      </select></div>
  </div>
  <label>Nota</label>
  <textarea id="f-nota" placeholder="Precio, horario, quién lo recomendó, link…"></textarea>
  <div class="msg" id="f-msg"></div>
  <div class="row" style="margin-top:14px">
    <button class="tab" id="f-cancel" style="background:#1a2432;color:#b8c4d0;padding:13px">Cancelar</button>
    <button class="tab" id="f-save" style="background:#0e7490;color:#fff;padding:13px">Guardar</button>
  </div>
</div></div>

<script>
const BACKEND = "https://masters-classic-bibliographic-cart.trycloudflare.com";
const SLUG = new URLSearchParams(location.search).get("v") || "mexico-2027";
const CATS = {hospedaje:"🏨 Hospedaje",comida:"🍽 Comida",actividad:"🎯 Actividades",
              lugar:"📍 Lugares",transporte:"🚗 Transporte",tramite:"📋 Trámites y servicios",otro:"📎 Otros"};
const ICO = {hospedaje:"🏨",comida:"🍽",actividad:"🎯",lugar:"📍",transporte:"🚗",tramite:"📋",otro:"📎"};
let D = null, vista = "itin", abiertos = new Set(), editId = null;

const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
function pin(){ let p=sessionStorage.getItem("vpin"); if(!p){p=prompt("PIN para editar:"); if(p)sessionStorage.setItem("vpin",p);} return p; }
async function api(path, body){
  const r = await fetch(BACKEND+path,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({pin:pin(),...body})});
  if(r.status===403){ sessionStorage.removeItem("vpin"); throw new Error("PIN incorrecto"); }
  if(!r.ok) throw new Error("Error "+r.status);
  return r.json();
}
const mapUrl = i => i.lat&&i.lon ? `https://www.google.com/maps/search/?api=1&query=${i.lat},${i.lon}`
                  : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((i.text||"")+" "+(i.destino||""))}`;

async function load(){
  try{
    D = await (await fetch(BACKEND+"/viajes/"+SLUG)).json();
    const v = D.viaje;
    $("vnom").textContent = v.nombre;
    const f = s => s ? s.split("-").reverse().slice(0,2).join("/") : "";
    $("vsub").textContent = `${f(v.desde)} al ${f(v.hasta)} · ${D.dias.length} días · ${v.tramos.map(t=>t.destino).join(" → ")}`;
    $("dl-dest").innerHTML = [...new Set(D.ideas.map(x=>x.destino).concat(v.tramos.map(t=>t.destino)))]
      .filter(Boolean).map(x=>`<option value="${esc(x)}">`).join("");
    render();
  }catch(e){ $("cont").innerHTML = '<div class="empty">No se pudo cargar.<br>'+e.message+'</div>'; }
}

function itemHtml(i, opts={}){
  const cls = i.estado==="descartado"?"desc":(i.estado==="hecho"?"hecho":"");
  const meta = [];
  if(opts.fecha && i.fecha) meta.push("📅 "+i.fecha.split("-").reverse().slice(0,2).join("/"));
  if(i.hora) meta.push("🕐 "+i.hora);
  if(i.destino && opts.destino!==false) meta.push("📍 "+esc(i.destino));
  if(i.direccion) meta.push(esc(i.direccion));
  return `<div class="it ${cls}" data-id="${i.id}">
    <div class="tx"><span>${ICO[i.categoria]||"📎"}</span><span>${esc(i.text)}</span></div>
    ${meta.length?`<div class="meta">${meta.join(" · ")}</div>`:""}
    ${i.nota?`<div class="nota">${esc(i.nota)}</div>`:""}
    <div class="acts">
      <a class="map" href="${mapUrl(i)}" target="_blank" rel="noopener">🗺 Mapa</a>
      ${i.tipo==="pendiente"
        ? `<button data-a="${i.estado==="hecho"?"wishlist":"hecho"}" class="${i.estado==="hecho"?"on":""}">${i.estado==="hecho"?"↺ Reabrir":"✓ Hecho"}</button>`
        : `<button data-a="confirmado" class="${i.estado==="confirmado"?"on":""}">✅</button>
           <button data-a="descartado" class="${i.estado==="descartado"?"on":""}">🗂</button>`}
      <button data-a="edit">✏️</button>
      <button data-a="del">🗑</button>
    </div></div>`;
}

function render(){
  if(!D) return;
  const c = $("cont");
  if(vista==="itin"){
    c.innerHTML = D.dias.map(d=>{
      const t = d.tramo||{};
      return `<div class="dia ${abiertos.has(d.fecha)?"open":""}" data-f="${d.fecha}">
        <div class="dhead">
          <div class="dnum"><b>${d.n}</b><span>${d.dow}</span></div>
          <div class="dinfo">
            <div class="f">${d.fecha.split("-").reverse().slice(0,2).join("/")}</div>
            <div class="h">${t.destino?"🏨 "+esc(t.destino):"—"}
              ${d.checkin?'<span class="badge b-in">CHECK-IN</span>':""}
              ${d.checkout?'<span class="badge b-out">CHECK-OUT</span>':""}
            </div></div>
          <div class="cnt">${d.items.length?d.items.length+" ▾":"＋"}</div>
        </div>
        <div class="dbody">
          ${t.hotel?`<div class="hotel"><div class="n">🏨 ${esc(t.hotel)}</div>
            <div class="d">${esc(t.direccion||"")}<br>${esc(t.nota||"")}</div>
            <div class="acts"><a class="map" href="https://www.google.com/maps/search/?api=1&query=${t.lat},${t.lon}" target="_blank" rel="noopener">🗺 Ver hotel en el mapa</a></div>
            </div>`:""}
          ${d.items.length ? d.items.map(i=>itemHtml(i,{destino:false})).join("")
            : '<div class="empty" style="padding:16px">Día libre. Tocá ➕ para agendar algo.</div>'}
        </div></div>`;
    }).join("") + (D.sin_fecha?`<div class="empty">💡 Tenés ${D.sin_fecha} ideas sin fecha en la solapa Ideas.</div>`:"");
  }
  else if(vista==="ideas"){
    c.innerHTML = D.ideas.length ? D.ideas.map(dd=>{
      const porCat={}; dd.items.forEach(i=>{(porCat[i.categoria] ||= []).push(i);});
      return `<div class="dest ${abiertos.has("I:"+dd.destino)?"open":""}" data-i="${esc(dd.destino)}">
        <div class="dhead2"><div><h2>${esc(dd.destino)}</h2>
          <div class="cnt" style="margin-top:4px">${dd.items.length} items</div></div>
          <span class="arrow">›</span></div>
        <div class="dbody" style="padding:0 15px 13px">
          ${Object.keys(CATS).filter(k=>porCat[k]).map(k=>
            `<div class="cat"><h3>${CATS[k]}</h3>${porCat[k].map(i=>itemHtml(i,{fecha:true,destino:false})).join("")}</div>`).join("")}
        </div></div>`;
    }).join("") : '<div class="empty">Todavía no hay ideas.</div>';
  }
  else {
    const p = D.pendientes;
    c.innerHTML = p.length ? p.map(i=>itemHtml(i,{fecha:true})).join("")
      : '<div class="empty">No hay pendientes.</div>';
  }
  bind();
}

function bind(){
  document.querySelectorAll(".dhead").forEach(h=>h.addEventListener("click",()=>{
    const d=h.closest(".dia"), k=d.dataset.f;
    d.classList.toggle("open"); d.classList.contains("open")?abiertos.add(k):abiertos.delete(k);
  }));
  document.querySelectorAll(".dhead2").forEach(h=>h.addEventListener("click",()=>{
    const d=h.closest(".dest"), k="I:"+d.dataset.i;
    d.classList.toggle("open"); d.classList.contains("open")?abiertos.add(k):abiertos.delete(k);
  }));
  document.querySelectorAll(".nota").forEach(n=>n.addEventListener("click",e=>{
    e.stopPropagation(); n.classList.toggle("full");
  }));
  document.querySelectorAll(".acts button").forEach(b=>b.addEventListener("click",async e=>{
    e.stopPropagation();
    const id=b.closest(".it").dataset.id, a=b.dataset.a;
    try{
      if(a==="del"){ if(!confirm("¿Borrar definitivamente?")) return; await api("/viajes/delete",{id}); }
      else if(a==="edit"){ abrirEdit(id); return; }
      else await api("/viajes/update",{id,estado:a});
      load();
    }catch(err){ alert(err.message); }
  }));
}

document.querySelectorAll(".tab[data-v]").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab[data-v]").forEach(x=>x.classList.remove("on"));
  t.classList.add("on"); vista=t.dataset.v; render();
}));

function abrirEdit(id){
  const i = [...D.dias.flatMap(d=>d.items), ...D.ideas.flatMap(x=>x.items), ...D.pendientes]
            .find(x=>x.id===id);
  if(!i) return;
  editId=id; $("mtit").textContent="Editar";
  $("f-text").value=i.text; $("f-tipo").value=i.tipo||"idea"; $("f-cat").value=i.categoria;
  $("f-dest").value=i.destino||""; $("f-fecha").value=i.fecha||""; $("f-hora").value=i.hora||"";
  $("f-est").value=i.estado==="descartado"?"wishlist":i.estado; $("f-nota").value=i.nota||"";
  $("modal").classList.add("on");
}
$("add").addEventListener("click",()=>{
  editId=null; $("mtit").textContent="Agregar";
  ["f-text","f-dest","f-fecha","f-hora","f-nota"].forEach(x=>$(x).value="");
  $("f-tipo").value = vista==="pend" ? "pendiente" : "idea";
  $("modal").classList.add("on");
});
$("f-cancel").addEventListener("click",()=>$("modal").classList.remove("on"));
$("modal").addEventListener("click",e=>{ if(e.target.id==="modal") $("modal").classList.remove("on"); });

$("f-save").addEventListener("click",async()=>{
  const m=$("f-msg");
  if(!$("f-text").value.trim()){ m.className="msg err"; m.textContent="Falta el nombre"; return; }
  const body={viaje:SLUG,text:$("f-text").value.trim(),tipo:$("f-tipo").value,
    categoria:$("f-cat").value,destino:$("f-dest").value.trim(),fecha:$("f-fecha").value,
    hora:$("f-hora").value,estado:$("f-est").value,nota:$("f-nota").value.trim(),addedBy:"web"};
  try{
    if(editId) await api("/viajes/update",{id:editId,...body});
    else await api("/viajes/add",body);
    $("modal").classList.remove("on"); m.className="msg"; load();
  }catch(e){ m.className="msg err"; m.textContent=e.message; }
});

$("refresh").addEventListener("click",load);
load();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(); });
</script>
</body>
</html>
